services:
  sustainability-website:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sustainability-website
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      - APP_URL=${APP_URL:-https://sustainability.ufsc.br}
      - PUBLIC_URL=${PUBLIC_URL:-https://sustainability.ufsc.br}
      - SITE_URL=${SITE_URL:-https://sustainability.ufsc.br}
      - VITE_SITE_URL=${VITE_SITE_URL:-https://sustainability.ufsc.br}
    volumes:
      - ./certs:/etc/nginx/certs:ro
