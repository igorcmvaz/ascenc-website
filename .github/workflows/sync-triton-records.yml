name: Sync Encrypted Triton Records

on:
  schedule:
    # Executa a cada 4 horas (antes do limite de expiração de 12h do ntfy.sh)
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-encrypted-records:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch and merge encrypted records from ntfy.sh
        run: |
          python3 - << 'EOF'
          import json
          import urllib.request
          from pathlib import Path

          topic = "triton_ufsc_enc_prod_4d9b7a1e"
          archive_path = Path("public/data/triton_encrypted_records.json")
          archive_path.parent.mkdir(parents=True, exist_ok=True)

          existing = {}
          if archive_path.exists():
              try:
                  for item in json.loads(archive_path.read_text(encoding="utf-8")):
                      if isinstance(item, dict) and item.get("id") and item.get("message"):
                          existing[item["id"]] = item
              except Exception:
                  pass

          url = f"https://ntfy.sh/{topic}/json?poll=1&since=all"
          req = urllib.request.Request(url, headers={"User-Agent": "UFSC-Triton-Sync/1.0"})
          raw = urllib.request.urlopen(req, timeout=20).read().decode("utf-8")

          added = 0
          for line in raw.splitlines():
              line = line.strip()
              if not line:
                  continue
              try:
                  item = json.loads(line)
                  if item.get("event") == "message" and item.get("id") and item.get("message"):
                      msg_obj = json.loads(item["message"])
                      if isinstance(msg_obj, dict) and msg_obj.get("v") == 1 and msg_obj.get("k") and msg_obj.get("iv") and msg_obj.get("c"):
                          if item["id"] not in existing:
                              existing[item["id"]] = {
                                  "id": item["id"],
                                  "time": item.get("time"),
                                  "message": item["message"],
                              }
                              added += 1
              except Exception:
                  continue

          merged = sorted(existing.values(), key=lambda x: x.get("time") or 0)
          archive_path.write_text(json.dumps(merged, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print(f"New encrypted records added: {added} (total: {len(merged)})")
          EOF

      - name: Commit and push if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/triton_encrypted_records.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(triton): arquiva registros criptografados (RSA-2048/AES-GCM)"
            git push origin main
          else
            echo "No new encrypted records to commit."
          fi
