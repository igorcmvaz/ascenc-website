# ==============================================================================
# Nginx Configuration - sustainability.ufsc.br
#
# NOTA DE INFRAESTRUTURA UFSC:
# O certificado SSL wildcard da universidade cobre estritamente um nível (*.ufsc.br)
# e NÃO contempla subdomínios de segundo nível como www.sustainability.ufsc.br.
# Portanto:
# 1. Qualquer tráfego HTTP (porta 80) para www.sustainability.ufsc.br ou
#    sustainability.ufsc.br é redirecionado imediatamente via 301 para
#    https://sustainability.ufsc.br (sem www), evitando erros de SSL.
# 2. O bloco HTTPS (porta 443) escuta estritamente como sustainability.ufsc.br.
# ==============================================================================

# 1. Bloco HTTP (porta 80): Redireciona www e não-www para o HTTPS canônico
server {
    listen 80;
    listen [::]:80;
    server_name sustainability.ufsc.br www.sustainability.ufsc.br;

    # Redirecionamento permanente 301 para https://sustainability.ufsc.br sem www
    return 301 https://sustainability.ufsc.br$request_uri;
}

# 2. Bloco HTTPS (porta 443): Servidor principal exclusivo para sustainability.ufsc.br
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sustainability.ufsc.br;

    # Certificado SSL da UFSC (*.ufsc.br)
    ssl_certificate /etc/nginx/certs/sustainability.ufsc.br.crt;
    ssl_certificate_key /etc/nginx/certs/sustainability.ufsc.br.key;

    # Parâmetros de segurança SSL/TLS modernos
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Cabeçalhos de Segurança HTTP
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Cache de ativos estáticos
    location ~* \.(?:js|css|png|jpg|jpeg|svg|webp|woff2?|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Arquivos especiais de SEO e Indexação
    location = /robots.txt {
        log_not_found off;
        access_log off;
    }

    location = /sitemap.xml {
        log_not_found off;
        access_log off;
    }

    # Roteamento SPA (Single Page Application)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
